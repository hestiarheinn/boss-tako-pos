<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boss Tako POS - Products</title>

  <link rel="icon" type="image/png" href="icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <div class="logo">
    <img src="icon.png" alt="Boss Tako Logo" class="brand-logo">
    <span>Boss Tako <strong>POS</strong></span>
  </div>
  <div class="time-display" id="currentTime">--:--:--</div>
  <nav class="nav-links">
    <a href="index.html"><i class="fa-solid fa-cart-shopping"></i> Orders</a>
    <a href="products.html" class="active"><i class="fa-solid fa-box-open"></i> Products</a>
    <a href="sales.html"><i class="fa-solid fa-chart-line"></i> Sales</a>
  </nav>
</header>

<main class="page-container">
  <h1>🍡 Product Management</h1>

  <section class="card">
    <div class="card-header">
      <h3><i class="fa-solid fa-plus"></i> Add Product</h3>
    </div>
    <div class="card-body">
      <div class="input-grid">
        <div class="input-group">
          <label for="pname">Product Name</label>
          <input id="pname" type="text" placeholder="e.g. Takoyaki Classic 6pcs">
        </div>
        <div class="input-group">
          <label for="pprice">Price (₱)</label>
          <input id="pprice" type="number" placeholder="0.00">
        </div>
      </div>
      <button onclick="addProduct()" class="btn btn-primary" style="width: auto; align-self: flex-start;">
        <i class="fa-solid fa-plus"></i> Add Product
      </button>
    </div>
  </section>

  <section class="card">
    <div class="card-header">
      <h3><i class="fa-solid fa-list"></i> Product List</h3>
    </div>
    <div class="card-body" style="padding: 0;">
      <div id="productList"></div>
    </div>
  </section>
</main>

<script>
const API = "http://localhost:3001";

async function loadProductsPage() {
  try {
    const res = await fetch(`${API}/products`);
    const products = await res.json();
    const container = document.getElementById("productList");
    container.innerHTML = "";

    products.forEach(p => {
      container.innerHTML += `
        <div class="product-row">
          <span><strong>${p.name}</strong></span>
          <div>
            <span style="margin-right: 15px; font-weight: 700; color: var(--color-primary);">₱${parseFloat(p.price).toFixed(2)}</span>
            <button onclick="deleteProduct(${p.id})" class="btn-icon"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>
      `;
    });
  } catch (err) {
    console.error("Failed to load products:", err);
  }
}

async function addProduct() {
  const name = document.getElementById("pname").value.trim();
  const price = document.getElementById("pprice").value.trim();

  if (!name || !price) {
    alert("⚠️ Please fill all fields");
    return;
  }

  await fetch(`${API}/products`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ name, price })
  });

  document.getElementById("pname").value = "";
  document.getElementById("pprice").value = "";
  loadProductsPage();
}

async function deleteProduct(id) {
  if (confirm("Are you sure you want to delete this product?")) {
    await fetch(`${API}/products/${id}`, { method: "DELETE" });
    loadProductsPage();
  }
}

setInterval(() => {
  const el = document.getElementById("currentTime");
  if (el) el.innerText = new Date().toLocaleTimeString();
}, 1000);

loadProductsPage();
</script>
</body>
</html>
