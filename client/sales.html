<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boss Tako POS - Sales</title>

  <link rel="icon" type="image/png" href="icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <div class="logo">
    <img src="icon.png" alt="Boss Tako Logo" class="brand-logo">
    <span>Boss Tako <strong>POS</strong></span>
  </div>
  <div class="time-display" id="currentTime">--:--:--</div>
  <nav class="nav-links">
    <a href="index.html"><i class="fa-solid fa-cart-shopping"></i> Orders</a>
    <a href="products.html"><i class="fa-solid fa-box-open"></i> Products</a>
    <a href="sales.html" class="active"><i class="fa-solid fa-chart-line"></i> Sales</a>
  </nav>
</header>

<main class="page-container">
  <h1>💰 Sales History</h1>

  <section class="card">
    <div class="card-header">
      <h3><i class="fa-solid fa-receipt"></i> Completed Orders</h3>
    </div>
    <div class="card-body">
      <div id="salesData"></div>
    </div>
  </section>
</main>

<script src="sales.js"></script>
<script>
loadSales();

setInterval(() => {
  const el = document.getElementById("currentTime");
  if (el) el.innerText = new Date().toLocaleTimeString();
}, 1000);
</script>
</body>
</html>
